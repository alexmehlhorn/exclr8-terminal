name: Release to NuGet

# Push a tag like `v1.0.1` to trigger a release. The workflow builds,
# tests, packs the .nupkg + .snupkg, and pushes them to nuget.org.
#
# Required repo secret:
#   NUGET_API_KEY  — generated at https://www.nuget.org/account/apikeys
#                    Scope: Push (new packages) + Push (existing).
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + history for source-link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches Exclr8.Terminal csproj <Version>
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          TAG="${TAG#v}"  # strip leading "v"
          CORE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Exclr8.Terminal/Exclr8.Terminal.csproj)
          echo "Tag: $TAG"
          echo "Exclr8.Terminal <Version>: $CORE_VERSION"
          if [ "$TAG" != "$CORE_VERSION" ]; then
            echo "::error::tag $TAG does not match Exclr8.Terminal csproj version $CORE_VERSION"
            exit 1
          fi
          # The sister .Pty package has its own <Version>; we don't
          # require it to match the tag (the two packages are versioned
          # independently). Just log for visibility.
          PTY_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Exclr8.Terminal.Pty/Exclr8.Terminal.Pty.csproj)
          echo "Exclr8.Terminal.Pty <Version>: $PTY_VERSION (independently versioned)"

      - name: Restore
        run: dotnet restore Exclr8.Terminal.slnx

      - name: Build
        run: dotnet build Exclr8.Terminal.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Exclr8.Terminal.Tests/Exclr8.Terminal.Tests.csproj -c Release --no-build --nologo --logger "console;verbosity=minimal"

      - name: Pack core
        run: dotnet pack Exclr8.Terminal/Exclr8.Terminal.csproj -c Release --no-build -o artifacts

      - name: Pack Pty sister
        run: dotnet pack Exclr8.Terminal.Pty/Exclr8.Terminal.Pty.csproj -c Release --no-build -o artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
